# Alembic migrations for FinSight's own tables (thread registry, idempotency keys).
# LangGraph's checkpoint/store tables are managed by LangGraph's setup(), not here.
#
# The database URL comes from MIGRATION_DATABASE_URL or DATABASE_URL (never stored here):
#   docker compose run --rm migrate                     # in Docker (recommended)
#   alembic upgrade head                                # with the env var set
#   alembic revision --autogenerate -m "add a column"   # after changing a Table in backend/

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
